name: Update YouTube sessions

# Se ejecuta solo manualmente desde la pestaña "Actions" del repositorio.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-sessions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch all YouTube playlist items (paginated)
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          PLAYLIST_ID="UU-HdzAvXl_Ye1KnHJTathFQ"
          echo "[]" > all_items.json
          PAGE_TOKEN=""

          while : ; do
            URL="https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId=${PLAYLIST_ID}&key=${YOUTUBE_API_KEY}"
            if [ -n "$PAGE_TOKEN" ]; then
              URL="${URL}&pageToken=${PAGE_TOKEN}"
            fi

            RESPONSE=$(curl -s "$URL")

            PAGE_ITEMS=$(echo "$RESPONSE" | jq '[.items[] | select(.snippet.resourceId.videoId != null) | {title: .snippet.title, videoId: .snippet.resourceId.videoId, publishedAt: .snippet.publishedAt}]')

            jq -s '.[0] + .[1]' all_items.json <(echo "$PAGE_ITEMS") > merged.json
            mv merged.json all_items.json

            PAGE_TOKEN=$(echo "$RESPONSE" | jq -r '.nextPageToken // empty')
            if [ -z "$PAGE_TOKEN" ]; then
              break
            fi
          done

          mv all_items.json sessions.json
          echo "Total sessions: $(jq 'length' sessions.json)"

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sessions.json
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Actualizar sessions.json desde YouTube"
            git push
          fi
